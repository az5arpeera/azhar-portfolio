<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Penrose / Escher impossible tri-bar: three identical beams rotated 120°,
       each with a corner overhang that laps the next beam so the loop can never
       close in real space. Transparent background. -->
  <g stroke="#5f4718" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="16,78 84,78 77,66 63,67 37,67" fill="#efd488" />
    <polygon points="16,78 84,78 77,66 63,67 37,67" fill="#cfa24d" transform="rotate(120 50 57)" />
    <polygon points="16,78 84,78 77,66 63,67 37,67" fill="#9c7629" transform="rotate(240 50 57)" />
  </g>
</svg>
